<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📦 KiddoCode - 推箱子</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            min-height: 100vh; display: flex; flex-direction: column; align-items: center;
            padding: 20px;
        }
        h1 { color: #2c3e50; text-align: center; margin-bottom: 15px; }
        .game-info {
            background: white; padding: 15px 30px; border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 20px;
            display: flex; gap: 30px; flex-wrap: wrap; justify-content: center;
        }
        .stat { color: #2c3e50; }
        .stat-value { font-weight: bold; color: #e74c3c; font-size: 28px; }
        .sokoban-container {
            display: grid; grid-template-columns: repeat(8, 45px);
            gap: 2px; background: #2c3e50; padding: 10px; border-radius: 10px;
        }
        .cell { width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; font-size: 28px; }
        .wall { background: #34495e; }
        .floor { background: #ecf0f1; }
        .target { background: #f39c12; }
        .player { background: #3498db; }
        .box-on-target { background: #27ae60; }
        .btn-group { display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; margin-top: 20px; }
        button {
            padding: 12px 25px; font-size: 16px; border: none; border-radius: 12px;
            cursor: pointer; font-weight: bold; transition: all 0.3s ease;
        }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .btn-secondary { background: linear-gradient(135deg, #95a5a6 0%, #7f8c8d 100%); color: white; }
        button:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(0,0,0,0.2); }
        .controls {
            display: grid; grid-template-columns: repeat(3, 60px); gap: 5px;
            margin-top: 20px;
        }
        .control-btn {
            width: 60px; height: 60px; font-size: 24px; border-radius: 10px;
            background: rgba(255,255,255,0.95); border: 2px solid #667eea;
        }
        .instructions {
            background: white; padding: 20px; border-radius: 15px;
            margin-top: 20px; max-width: 500px; text-align: center;
        }
        .instructions h3 { color: #2c3e50; margin-bottom: 10px; }
        .instructions p { color: #555; line-height: 1.6; }
    </style>
    <link rel="stylesheet" href="celebration-system.css">
</head>
<body>
    <h1>📦 推箱子大师</h1>
    
    <div class="game-info">
        <div class="stat">步数: <span class="stat-value" id="moves">0</span></div>
        <div class="stat">推: <span class="stat-value" id="pushes">0</span></div>
    </div>
    
    <div class="sokoban-container" id="sokoban"></div>
    
    <div class="controls">
        <div></div>
        <button class="control-btn" onclick="move(0,-1)">⬆️</button>
        <div></div>
        <button class="control-btn" onclick="move(-1,0)">⬅️</button>
        <button class="control-btn" onclick="move(0,1)">⬇️</button>
        <button class="control-btn" onclick="move(1,0)">➡️</button>
    </div>
    
    <div class="btn-group">
        <button class="btn-secondary" onclick="initGame()">🔄 重新开始</button>
    </div>
    
    <div class="instructions">
        <h3>📖 怎么玩？</h3>
        <p>
            把所有箱子 📦 推到橙色目标点！<br>
            只能推不能拉，看看你用几步完成！
        </p>
    </div>

    <script src="celebration-system.js"></script>
    <script>
        const LEVEL = [
            ['W','W','W','W','W','W','W','W'],
            ['W','.','.','.','.','.','.','W'],
            ['W','.','B','.','.','.','.','W'],
            ['W','.','.','P','.','.','.','W'],
            ['W','.','.','B','.','.','.','W'],
            ['W','.','.','.','.','T','.','W'],
            ['W','.','.','T','.','.','.','W'],
            ['W','W','W','W','W','W','W','W']
        ];
        
        let map = [];
        let playerX = 0;
        let playerY = 0;
        let moves = 0;
        let pushes = 0;
        
        function initGame() {
            map = LEVEL.map(row => [...row]);
            moves = 0;
            pushes = 0;
            document.getElementById('moves').textContent = '0';
            document.getElementById('pushes').textContent = '0';
            for(let y=0; y<map.length; y++) {
                for(let x=0; x<map[0].length; x++) {
                    if(map[y][x] === 'P') {
                        playerX = x;
                        playerY = y;
                        map[y][x] = '.';
                    }
                }
            }
            render();
        }
        
        function render() {
            const container = document.getElementById('sokoban');
            container.innerHTML = '';
            for(let y=0; y<map.length; y++) {
                for(let x=0; x<map[0].length; x++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    const isTarget = LEVEL[y][x] === 'T';
                    if(x === playerX && y === playerY) {
                        cell.className += ' cell player';
                        cell.textContent = '😎';
                        if(isTarget) cell.style.background = '#3498db';
                    } else if(map[y][x] === 'W') {
                        cell.className += ' cell wall';
                        cell.textContent = '🧱';
                    } else if(map[y][x] === 'B') {
                        cell.className += ' cell ' + (isTarget ? 'box-on-target' : 'floor');
                        cell.textContent = '📦';
                        if(isTarget) cell.style.color = 'white';
                    } else if(isTarget) {
                        cell.className += ' cell target';
                        cell.textContent = '🎯';
                    } else {
                        cell.className += ' cell floor';
                    }
                    container.appendChild(cell);
                }
            }
        }
        
        function move(dx, dy) {
            const newX = playerX + dx;
            const newY = playerY + dy;
            if(newY <0 || newY >= map.length || newX <0 || newX >= map[0].length) return;
            if(map[newY][newX] === 'W') return;
            
            if(map[newY][newX] === 'B') {
                const boxNewX = newX + dx;
                const boxNewY = newY + dy;
                if(boxNewY <0 || boxNewY >= map.length || boxNewX <0 || boxNewX >= map[0].length) return;
                if(map[boxNewY][boxNewX] === 'W' || map[boxNewY][boxNewX] === 'B') return;
                map[newY][newX] = '.';
                map[boxNewY][boxNewX] = 'B';
                pushes++;
                document.getElementById('pushes').textContent = pushes;
            }
            
            playerX = newX;
            playerY = newY;
            moves++;
            document.getElementById('moves').textContent = moves;
            render();
            checkWin();
        }
        
        document.addEventListener('keydown', (e) => {
            switch(e.key) {
                case 'ArrowUp': move(0,-1); break;
                case 'ArrowDown': move(0,1); break;
                case 'ArrowLeft': move(-1,0); break;
                case 'ArrowRight': move(1,0); break;
            }
        });
        
        function checkWin() {
            let win = true;
            for(let y=0; y<map.length; y++) {
                for(let x=0; x<map[0].length; x++) {
                    if(LEVEL[y][x] === 'T' && map[y][x] !== 'B') {
                        win = false;
                    }
                }
            }
            if(win) {
                setTimeout(showWin, 300);
            }
        }
        
        function showWin() {
            window.kiddoCelebration.saveAchievement({ stars:3, levelCompleted:true });
            window.kiddoCelebration.showEnhancedWin(
                '推箱子', '太厉害了！', 3, { '步数': moves, '推': pushes },
                { replay: initGame }
            );
        }
        
        initGame();
    </script>
</body>
</html>
